name: security-audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-app
        with:
          node: "true"
          flux-username: ${{ secrets.FLUX_USERNAME }}
          flux-license-key: ${{ secrets.FLUX_LICENSE_KEY }}

      - name: Composer audit
        id: composer_audit
        continue-on-error: true
        run: composer audit --locked --no-interaction

      - name: NPM audit
        id: npm_audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Open a tracking issue if either audit failed
        if: >-
          github.event_name == 'schedule' &&
          (steps.composer_audit.outcome == 'failure' || steps.npm_audit.outcome == 'failure')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Weekly dependency audit reported vulnerabilities: ${runUrl}`,
              '',
              `- composer audit: ${{ steps.composer_audit.outcome == 'failure' && '**failing**' || 'ok' }}`,
              `- npm audit: ${{ steps.npm_audit.outcome == 'failure' && '**failing**' || 'ok' }}`,
              '',
              '_Auto-generated by the `security-audit` workflow._',
            ].join('\n');
            const title = 'Dependency security audit failure';
            const { data: search } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            if (search.total_count > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: search.items[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Fail if either audit found something
        if: steps.composer_audit.outcome == 'failure' || steps.npm_audit.outcome == 'failure'
        run: |
          echo "composer audit: ${{ steps.composer_audit.outcome }}"
          echo "npm audit: ${{ steps.npm_audit.outcome }}"
          exit 1
